# Rules share one workload-traversal prelude; keep it identical across rules when editing.
version: 1
name: kubernetes-hardening
release: 0.1.0
description: Pod security hardening for literal Kubernetes workload manifests, reported per workload and container.
maturity: experimental
owner: openhoo/hoolicy-maintainers
compatibilityNotes: >-
  Inspects literal YAML/JSON manifests only. Helm templates, Kustomize overlays, Jsonnet, and other generators
  are not rendered; check rendered output instead. Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet, Job,
  and CronJob (jobTemplate) pod specs are checked, including List items; other kinds, including custom
  resources with embedded pod templates, are ignored. Findings point at the YAML document start, not the
  container line. Allowlists are exact parameter values; anything else needs a narrow waiver or file
  exclusion. Requires Hoolicy with structured.cel object-list results, pack parameters, and the CEL lists extension.
compatibility:
  config: '>=1 <2'
  hoolicy: '>=0.5.1-0 <2.0.0'
parameters:
  manifest_globs:
    type: string_list
    description: Literal Kubernetes manifest files to inspect.
    default: ['deploy/**/*.{yaml,yml}', 'k8s/**/*.{yaml,yml}']
  excluded_paths:
    type: string_list
    description: Reviewed narrow exclusions for templates, generated, vendored, or non-workload YAML.
    default: ['.hoolicy/vendor/**', '**/templates/**', '**/kustomization.{yaml,yml}', '**/Chart.yaml', '**/values*.{yaml,yml}']
  privileged_allowed_workloads:
    type: string_list
    description: "Reviewed workloads, as Kind/name, allowed to run privileged containers."
    default: []
  host_namespace_allowed_workloads:
    type: string_list
    description: "Reviewed workloads, as Kind/name, allowed to use hostNetwork, hostPID, or hostIPC."
    default: []
  host_path_allowed_paths:
    type: string_list
    description: "Exact hostPath paths reviewed as safe to mount, such as /var/log."
    default: []
  allowed_added_capabilities:
    type: string_list
    description: "Capabilities containers may add, without the CAP_ prefix."
    default: ["NET_BIND_SERVICE"]
  allowed_seccomp_profile_types:
    type: string_list
    description: "Accepted effective seccompProfile types."
    default: ["RuntimeDefault", "Localhost"]
  automount_allowed_service_accounts:
    type: string_list
    description: "serviceAccountName values whose pods may automount API tokens."
    default: []
  require_namespace:
    type: bool
    description: "Also require metadata.namespace on every workload; keep false when Kustomize, Argo CD, or the deployer assigns it."
    default: false
  forbidden_namespaces:
    type: string_list
    description: "Namespaces workloads must not use."
    default: ["default"]
rules:
  - id: kubernetes-hardening.privileged
    title: "Containers are not privileged"
    description: "Rejects securityContext.privileged: true on every container, initContainer, and ephemeralContainer unless the workload is allowlisted."
    rationale: "A privileged container has host-level device and kernel access and defeats namespace isolation."
    remediation: "Remove privileged: true; grant only the specific capability or device the workload needs through a reviewed exception."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
    exclude: ['{{ excluded_paths }}']
    controls: [{framework: Kubernetes-Pod-Security-Standards, id: privileged}]
    spec:
      message: "Containers are not privileged"
      costLimit: 1000000
      expression: |
        documents
          .filter(d, type(d.data) == map && 'kind' in d.data && type(d.data.kind) == string)
          .map(d, (d.data.kind == 'List' && 'items' in d.data && type(d.data.items) == list ? d.data.items : [d.data])
            .filter(o, type(o) == map && 'kind' in o && o.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'])
            .map(o, {'kind': o.kind, 'meta': 'metadata' in o && type(o.metadata) == map ? o.metadata : {}, 'pod': o.kind == 'Pod'
                  ? ('spec' in o && type(o.spec) == map ? o.spec : {})
                  : o.kind == 'CronJob'
                    ? ('spec' in o && type(o.spec) == map && 'jobTemplate' in o.spec && type(o.spec.jobTemplate) == map && 'spec' in o.spec.jobTemplate && type(o.spec.jobTemplate.spec) == map
                       && 'template' in o.spec.jobTemplate.spec && type(o.spec.jobTemplate.spec.template) == map && 'spec' in o.spec.jobTemplate.spec.template && type(o.spec.jobTemplate.spec.template.spec) == map
                       ? o.spec.jobTemplate.spec.template.spec : {})
                    : ('spec' in o && type(o.spec) == map && 'template' in o.spec && type(o.spec.template) == map && 'spec' in o.spec.template && type(o.spec.template.spec) == map
                       ? o.spec.template.spec : {})})
            .map(w, {'pod': w.pod, 'meta': w.meta,
              'id': w.kind + '/' + ('name' in w.meta && type(w.meta.name) == string ? w.meta.name : '(unnamed)')})
            .map(w, {'pod': w.pod, 'meta': w.meta, 'id': w.id,
              'psc': 'securityContext' in w.pod && type(w.pod.securityContext) == map ? w.pod.securityContext : {},
              'containers': ('initContainers' in w.pod && type(w.pod.initContainers) == list
                    ? w.pod.initContainers.filter(c, type(c) == map).map(c, {
                        'group': 'initContainers', 'ref': w.id + ' initContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('containers' in w.pod && type(w.pod.containers) == list
                    ? w.pod.containers.filter(c, type(c) == map).map(c, {
                        'group': 'containers', 'ref': w.id + ' container "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('ephemeralContainers' in w.pod && type(w.pod.ephemeralContainers) == list
                    ? w.pod.ephemeralContainers.filter(c, type(c) == map).map(c, {
                        'group': 'ephemeralContainers', 'ref': w.id + ' ephemeralContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])})
            .map(w, w.containers.filter(c, 'privileged' in c.sc && c.sc.privileged == true && !(w.id in pack.privileged_allowed_workloads)).map(c, c.ref + ' sets securityContext.privileged: true'))
            .flatten()
            .map(message, {'path': d.path, 'line': d.line, 'column': d.column,
              'key': 'document:' + string(d.index) + ':' + message, 'message': message}))
          .flatten()
  - id: kubernetes-hardening.privilege-escalation
    title: "Containers explicitly disable privilege escalation"
    description: "Requires securityContext.allowPrivilegeEscalation: false on every container; the field has no pod-level form."
    rationale: "Without no_new_privs, setuid binaries and file capabilities can raise a process above its starting privileges."
    remediation: "Set securityContext.allowPrivilegeEscalation: false on each container, initContainer, and ephemeralContainer."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
    exclude: ['{{ excluded_paths }}']
    controls: [{framework: Kubernetes-Pod-Security-Standards, id: privilege-escalation}]
    spec:
      message: "Containers explicitly disable privilege escalation"
      costLimit: 1000000
      expression: |
        documents
          .filter(d, type(d.data) == map && 'kind' in d.data && type(d.data.kind) == string)
          .map(d, (d.data.kind == 'List' && 'items' in d.data && type(d.data.items) == list ? d.data.items : [d.data])
            .filter(o, type(o) == map && 'kind' in o && o.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'])
            .map(o, {'kind': o.kind, 'meta': 'metadata' in o && type(o.metadata) == map ? o.metadata : {}, 'pod': o.kind == 'Pod'
                  ? ('spec' in o && type(o.spec) == map ? o.spec : {})
                  : o.kind == 'CronJob'
                    ? ('spec' in o && type(o.spec) == map && 'jobTemplate' in o.spec && type(o.spec.jobTemplate) == map && 'spec' in o.spec.jobTemplate && type(o.spec.jobTemplate.spec) == map
                       && 'template' in o.spec.jobTemplate.spec && type(o.spec.jobTemplate.spec.template) == map && 'spec' in o.spec.jobTemplate.spec.template && type(o.spec.jobTemplate.spec.template.spec) == map
                       ? o.spec.jobTemplate.spec.template.spec : {})
                    : ('spec' in o && type(o.spec) == map && 'template' in o.spec && type(o.spec.template) == map && 'spec' in o.spec.template && type(o.spec.template.spec) == map
                       ? o.spec.template.spec : {})})
            .map(w, {'pod': w.pod, 'meta': w.meta,
              'id': w.kind + '/' + ('name' in w.meta && type(w.meta.name) == string ? w.meta.name : '(unnamed)')})
            .map(w, {'pod': w.pod, 'meta': w.meta, 'id': w.id,
              'psc': 'securityContext' in w.pod && type(w.pod.securityContext) == map ? w.pod.securityContext : {},
              'containers': ('initContainers' in w.pod && type(w.pod.initContainers) == list
                    ? w.pod.initContainers.filter(c, type(c) == map).map(c, {
                        'group': 'initContainers', 'ref': w.id + ' initContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('containers' in w.pod && type(w.pod.containers) == list
                    ? w.pod.containers.filter(c, type(c) == map).map(c, {
                        'group': 'containers', 'ref': w.id + ' container "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('ephemeralContainers' in w.pod && type(w.pod.ephemeralContainers) == list
                    ? w.pod.ephemeralContainers.filter(c, type(c) == map).map(c, {
                        'group': 'ephemeralContainers', 'ref': w.id + ' ephemeralContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])})
            .map(w, w.containers.filter(c, !('allowPrivilegeEscalation' in c.sc && c.sc.allowPrivilegeEscalation == false)).map(c, c.ref + ' does not set securityContext.allowPrivilegeEscalation: false'))
            .flatten()
            .map(message, {'path': d.path, 'line': d.line, 'column': d.column,
              'key': 'document:' + string(d.index) + ':' + message, 'message': message}))
          .flatten()
  - id: kubernetes-hardening.host-namespaces
    title: "Pods do not share host namespaces"
    description: "Rejects hostNetwork, hostPID, or hostIPC set to true unless the workload is allowlisted as Kind/name."
    rationale: "Host namespaces expose host network interfaces, processes, and IPC objects to the workload."
    remediation: "Remove hostNetwork, hostPID, and hostIPC; use Services, sidecars, or a reviewed node agent exception instead."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
    exclude: ['{{ excluded_paths }}']
    controls: [{framework: Kubernetes-Pod-Security-Standards, id: host-namespaces}]
    spec:
      message: "Pods do not share host namespaces"
      costLimit: 1000000
      expression: |
        documents
          .filter(d, type(d.data) == map && 'kind' in d.data && type(d.data.kind) == string)
          .map(d, (d.data.kind == 'List' && 'items' in d.data && type(d.data.items) == list ? d.data.items : [d.data])
            .filter(o, type(o) == map && 'kind' in o && o.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'])
            .map(o, {'kind': o.kind, 'meta': 'metadata' in o && type(o.metadata) == map ? o.metadata : {}, 'pod': o.kind == 'Pod'
                  ? ('spec' in o && type(o.spec) == map ? o.spec : {})
                  : o.kind == 'CronJob'
                    ? ('spec' in o && type(o.spec) == map && 'jobTemplate' in o.spec && type(o.spec.jobTemplate) == map && 'spec' in o.spec.jobTemplate && type(o.spec.jobTemplate.spec) == map
                       && 'template' in o.spec.jobTemplate.spec && type(o.spec.jobTemplate.spec.template) == map && 'spec' in o.spec.jobTemplate.spec.template && type(o.spec.jobTemplate.spec.template.spec) == map
                       ? o.spec.jobTemplate.spec.template.spec : {})
                    : ('spec' in o && type(o.spec) == map && 'template' in o.spec && type(o.spec.template) == map && 'spec' in o.spec.template && type(o.spec.template.spec) == map
                       ? o.spec.template.spec : {})})
            .map(w, {'pod': w.pod, 'meta': w.meta,
              'id': w.kind + '/' + ('name' in w.meta && type(w.meta.name) == string ? w.meta.name : '(unnamed)')})
            .map(w, {'pod': w.pod, 'meta': w.meta, 'id': w.id,
              'psc': 'securityContext' in w.pod && type(w.pod.securityContext) == map ? w.pod.securityContext : {},
              'containers': ('initContainers' in w.pod && type(w.pod.initContainers) == list
                    ? w.pod.initContainers.filter(c, type(c) == map).map(c, {
                        'group': 'initContainers', 'ref': w.id + ' initContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('containers' in w.pod && type(w.pod.containers) == list
                    ? w.pod.containers.filter(c, type(c) == map).map(c, {
                        'group': 'containers', 'ref': w.id + ' container "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('ephemeralContainers' in w.pod && type(w.pod.ephemeralContainers) == list
                    ? w.pod.ephemeralContainers.filter(c, type(c) == map).map(c, {
                        'group': 'ephemeralContainers', 'ref': w.id + ' ephemeralContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])})
            .map(w, w.id in pack.host_namespace_allowed_workloads ? [] : ['hostNetwork', 'hostPID', 'hostIPC'].filter(f, f in w.pod && w.pod[f] == true).map(f, w.id + ' sets ' + f + ': true'))
            .flatten()
            .map(message, {'path': d.path, 'line': d.line, 'column': d.column,
              'key': 'document:' + string(d.index) + ':' + message, 'message': message}))
          .flatten()
  - id: kubernetes-hardening.host-path-volumes
    title: "Pods do not mount hostPath volumes"
    description: "Rejects hostPath volumes whose path is not in host_path_allowed_paths and names each path."
    rationale: "hostPath volumes give the workload read or write access to the node filesystem and can enable node takeover."
    remediation: "Replace hostPath with a PersistentVolumeClaim, emptyDir, ConfigMap, Secret, or CSI volume; waive reviewed node agents narrowly."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
    exclude: ['{{ excluded_paths }}']
    controls: [{framework: Kubernetes-Pod-Security-Standards, id: host-path-volumes}]
    spec:
      message: "Pods do not mount hostPath volumes"
      costLimit: 1000000
      expression: |
        documents
          .filter(d, type(d.data) == map && 'kind' in d.data && type(d.data.kind) == string)
          .map(d, (d.data.kind == 'List' && 'items' in d.data && type(d.data.items) == list ? d.data.items : [d.data])
            .filter(o, type(o) == map && 'kind' in o && o.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'])
            .map(o, {'kind': o.kind, 'meta': 'metadata' in o && type(o.metadata) == map ? o.metadata : {}, 'pod': o.kind == 'Pod'
                  ? ('spec' in o && type(o.spec) == map ? o.spec : {})
                  : o.kind == 'CronJob'
                    ? ('spec' in o && type(o.spec) == map && 'jobTemplate' in o.spec && type(o.spec.jobTemplate) == map && 'spec' in o.spec.jobTemplate && type(o.spec.jobTemplate.spec) == map
                       && 'template' in o.spec.jobTemplate.spec && type(o.spec.jobTemplate.spec.template) == map && 'spec' in o.spec.jobTemplate.spec.template && type(o.spec.jobTemplate.spec.template.spec) == map
                       ? o.spec.jobTemplate.spec.template.spec : {})
                    : ('spec' in o && type(o.spec) == map && 'template' in o.spec && type(o.spec.template) == map && 'spec' in o.spec.template && type(o.spec.template.spec) == map
                       ? o.spec.template.spec : {})})
            .map(w, {'pod': w.pod, 'meta': w.meta,
              'id': w.kind + '/' + ('name' in w.meta && type(w.meta.name) == string ? w.meta.name : '(unnamed)')})
            .map(w, {'pod': w.pod, 'meta': w.meta, 'id': w.id,
              'psc': 'securityContext' in w.pod && type(w.pod.securityContext) == map ? w.pod.securityContext : {},
              'containers': ('initContainers' in w.pod && type(w.pod.initContainers) == list
                    ? w.pod.initContainers.filter(c, type(c) == map).map(c, {
                        'group': 'initContainers', 'ref': w.id + ' initContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('containers' in w.pod && type(w.pod.containers) == list
                    ? w.pod.containers.filter(c, type(c) == map).map(c, {
                        'group': 'containers', 'ref': w.id + ' container "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('ephemeralContainers' in w.pod && type(w.pod.ephemeralContainers) == list
                    ? w.pod.ephemeralContainers.filter(c, type(c) == map).map(c, {
                        'group': 'ephemeralContainers', 'ref': w.id + ' ephemeralContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])})
            .map(w, ('volumes' in w.pod && type(w.pod.volumes) == list ? w.pod.volumes : [])
                .filter(v, type(v) == map && 'hostPath' in v
                  && !(type(v.hostPath) == map && 'path' in v.hostPath && v.hostPath.path in pack.host_path_allowed_paths))
                .map(v, w.id + ' volume "' + ('name' in v && type(v.name) == string ? v.name : '(unnamed)') + '" mounts hostPath '
                  + (type(v.hostPath) == map && 'path' in v.hostPath && type(v.hostPath.path) == string ? v.hostPath.path : '(no path)')))
            .flatten()
            .map(message, {'path': d.path, 'line': d.line, 'column': d.column,
              'key': 'document:' + string(d.index) + ':' + message, 'message': message}))
          .flatten()
  - id: kubernetes-hardening.capabilities-drop-all
    title: "Containers drop all Linux capabilities"
    description: "Requires securityContext.capabilities.drop to contain ALL on every container."
    rationale: "The default runtime capability set includes privileges such as NET_RAW that most workloads never need."
    remediation: "Set securityContext.capabilities.drop: [ALL] and add back only reviewed capabilities such as NET_BIND_SERVICE."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
    exclude: ['{{ excluded_paths }}']
    controls: [{framework: Kubernetes-Pod-Security-Standards, id: capabilities}]
    spec:
      message: "Containers drop all Linux capabilities"
      costLimit: 1000000
      expression: |
        documents
          .filter(d, type(d.data) == map && 'kind' in d.data && type(d.data.kind) == string)
          .map(d, (d.data.kind == 'List' && 'items' in d.data && type(d.data.items) == list ? d.data.items : [d.data])
            .filter(o, type(o) == map && 'kind' in o && o.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'])
            .map(o, {'kind': o.kind, 'meta': 'metadata' in o && type(o.metadata) == map ? o.metadata : {}, 'pod': o.kind == 'Pod'
                  ? ('spec' in o && type(o.spec) == map ? o.spec : {})
                  : o.kind == 'CronJob'
                    ? ('spec' in o && type(o.spec) == map && 'jobTemplate' in o.spec && type(o.spec.jobTemplate) == map && 'spec' in o.spec.jobTemplate && type(o.spec.jobTemplate.spec) == map
                       && 'template' in o.spec.jobTemplate.spec && type(o.spec.jobTemplate.spec.template) == map && 'spec' in o.spec.jobTemplate.spec.template && type(o.spec.jobTemplate.spec.template.spec) == map
                       ? o.spec.jobTemplate.spec.template.spec : {})
                    : ('spec' in o && type(o.spec) == map && 'template' in o.spec && type(o.spec.template) == map && 'spec' in o.spec.template && type(o.spec.template.spec) == map
                       ? o.spec.template.spec : {})})
            .map(w, {'pod': w.pod, 'meta': w.meta,
              'id': w.kind + '/' + ('name' in w.meta && type(w.meta.name) == string ? w.meta.name : '(unnamed)')})
            .map(w, {'pod': w.pod, 'meta': w.meta, 'id': w.id,
              'psc': 'securityContext' in w.pod && type(w.pod.securityContext) == map ? w.pod.securityContext : {},
              'containers': ('initContainers' in w.pod && type(w.pod.initContainers) == list
                    ? w.pod.initContainers.filter(c, type(c) == map).map(c, {
                        'group': 'initContainers', 'ref': w.id + ' initContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('containers' in w.pod && type(w.pod.containers) == list
                    ? w.pod.containers.filter(c, type(c) == map).map(c, {
                        'group': 'containers', 'ref': w.id + ' container "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])
                  + ('ephemeralContainers' in w.pod && type(w.pod.ephemeralContainers) == list
                    ? w.pod.ephemeralContainers.filter(c, type(c) == map).map(c, {
                        'group': 'ephemeralContainers', 'ref': w.id + ' ephemeralContainer "' + ('name' in c && type(c.name) == string ? c.name : '(unnamed)') + '"',
                        'sc': 'securityContext' in c && type(c.securityContext) == map ? c.securityContext : {},
                        'c': c})
                    : [])})
            .map(w, w.containers.filter(c, !('drop' in ('capabilities' in c.sc && type(c.sc.capabilities) == map ? c.sc.capabilities : {}) && type(('capabilities' in c.sc && type(c.sc.capabilities) == map ? c.sc.capabilities : {}).drop) == list && 'ALL' in ('capabilities' in c.sc && type(c.sc.capabilities) == map ? c.sc.capabilities : {}).drop)).map(c, c.ref + ' does not drop ALL capabilities'))
            .flatten()
            .map(message, {'path': d.path, 'line': d.line, 'column': d.column,
              'key': 'document:' + string(d.index) + ':' + message, 'message': message}))
          .flatten()
  - id: kubernetes-hardening.added-capabilities
    title: "Containers add only allowlisted capabilities"
    description: "Rejects every capabilities.add entry outside allowed_added_capabilities (default NET_BIND_SERVICE), naming each capability."
    rationale: "Capabilities such as SYS_ADMIN, NET_ADMIN, NET_RAW, or SYS_PTRACE enable container escape and network attacks."
    remediation: "Remove added capabilities, or add a reviewed capability to allowed_added_capabilities for this repository."
    severity: error
    kind: structured.cel
    files: ['{{ manifest_globs }}']
