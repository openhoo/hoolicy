name: Hoolicy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for decision comparison against a pull-request base.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go install github.com/openhoo/hoolicy/cmd/hoolicy@v0.2.0
      - name: Diagnose policy inputs
        env:
          HOOLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: hoolicy doctor
      - name: Evaluate complete repository
        env:
          HOOLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOOLICY_MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          hoolicy check --format json --output hoolicy-report.json || status=$?
          hoolicy check --format github --output hoolicy-summary.md || true
          test ! -f hoolicy-summary.md || cat hoolicy-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoolicy-report
          path: hoolicy-report.json
