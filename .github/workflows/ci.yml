name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.1.0

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Hooversion
        uses: openhoo/hooversion/actions/setup@f2186561c587b58c5ea08c74c15800cdd39eab42 # v1.1.0
        with:
          version: ${{ env.HOOVERSION_VERSION }}
      - name: Lint commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            hooversion lint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"
          else
            hooversion lint --last
          fi

  test:
    name: Go ${{ matrix.os }}
    needs: commitlint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...

  quality:
    name: Policy and quality
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting and module graph
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Stable-contract and performance gates
        run: |
          go test ./sdk -run TestStableContractGoldenDigests -count=1
          go test ./internal/engine -run '^$' -bench 'BenchmarkEngine(SmallRepository|Check|LargeMonorepo|AdversarialLimit)$' -benchtime=1x
      - name: Build and dogfood
        env:
          HOOLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOOLICY_MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          mkdir -p dist
          go build -trimpath -o dist/hoolicy ./cmd/hoolicy
          dist/hoolicy validate
          for pack in packs/*; do
            dist/hoolicy pack verify "$pack"
            dist/hoolicy pack snapshot "$pack"
            dist/hoolicy lint "$pack"
          done
          dist/hoolicy check
      - name: Dogfood Hoolicy action
        uses: ./actions/check
        with:
          executable: ./dist/hoolicy
      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@5849431da3a3fb503053d2f89282519797082074 # v0.6.4
        with:
          version: 0.6.4
          policy: hooray-policy.yaml
          format: table
          output: ""
      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@03b34bc8957995959d43531e82130a2c95bf01fa # v0.3.1
        with:
          version: 0.3.0
          paths: |
            cmd
            internal
            sdk
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@5f29337d0c39c47c691947aae0a201d2cfca8d64 # v0.3.0
        with:
          version: 0.3.0

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate JSON schemas
        run: jq empty schemas/*.json schemas/v1/*.json
      - name: Reproducible cross-platform archives
        run: scripts/verify-reproducible.sh
      - name: Build container
        run: docker build --tag hoolicy:ci .
