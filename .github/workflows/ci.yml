name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.0.1

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Hooversion
        uses: openhoo/hooversion/actions/setup@2f977d9c91d98d800cac6557fa170cf1a7fccd39 # v1.0.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
      - name: Lint commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            hooversion lint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"
          else
            hooversion lint --last
          fi

  test:
    name: Go ${{ matrix.os }}
    needs: commitlint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...

  quality:
    name: Policy and quality
    needs: commitlint
    runs-on: ubuntu-latest
    env:
      HOOLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HOOLICY_MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting and module graph
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build and dogfood
        run: |
          mkdir -p dist
          go build -trimpath -o dist/hoolicy ./cmd/hoolicy
          dist/hoolicy validate
          dist/hoolicy test packs/repository packs/supply-chain packs/product-quality
          dist/hoolicy check
      - name: Validate JSON schemas
        run: jq empty schemas/*.json
      - name: Build container
        run: docker build --tag hoolicy:ci .
