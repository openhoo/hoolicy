                  securityContext: {privileged: true}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.privileged", "path": "deploy/agent.yaml", "line": 1, "messageContains": "Deployment/node-agent container \"agent\""}
    findingCount: 1
  - name: "privilege-escalation: missing field and true value fail"
    rule: kubernetes-hardening.privilege-escalation
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {readOnlyRootFilesystem: true}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
                - name: worker
                  image: registry.example.com/worker:1
                  securityContext: {allowPrivilegeEscalation: true}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.privilege-escalation", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app container \"app\" does not set securityContext.allowPrivilegeEscalation: false"}
      - {"ruleId": "kubernetes-hardening.privilege-escalation", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app container \"worker\" does not set"}
    findingCount: 2
  - name: "privilege-escalation: string false is not boolean false"
    rule: kubernetes-hardening.privilege-escalation
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
