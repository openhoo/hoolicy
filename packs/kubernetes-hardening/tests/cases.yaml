version: 1
cases:
  - name: "privileged: hardened Deployment passes"
    rule: kubernetes-hardening.privileged
    outcome: pass
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "privilege-escalation: hardened Deployment passes"
    rule: kubernetes-hardening.privilege-escalation
    outcome: pass
