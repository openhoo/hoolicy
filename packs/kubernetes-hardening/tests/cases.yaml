                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "host-path-volumes: every hostPath volume is named"
    rule: kubernetes-hardening.host-path-volumes
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              volumes:
                - {name: logs, hostPath: {path: /var/log}}
                - {name: sock, hostPath: {path: /var/run/docker.sock, type: Socket}}
                - {name: tmp, emptyDir: {}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.host-path-volumes", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app volume \"logs\" mounts hostPath /var/log"}
      - {"ruleId": "kubernetes-hardening.host-path-volumes", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app volume \"sock\" mounts hostPath /var/run/docker.sock"}
    findingCount: 2
  - name: "host-path-volumes: allowlisted path passes, others still fail"
    rule: kubernetes-hardening.host-path-volumes
    outcome: fail
    parameters: {"host_path_allowed_paths": ["/var/log"]}
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              volumes:
                - {name: logs, hostPath: {path: /var/log}}
                - {name: sock, hostPath: {path: /var/run/docker.sock, type: Socket}}
                - {name: tmp, emptyDir: {}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.host-path-volumes", "path": "deploy/app.yaml", "line": 1, "messageContains": "/var/run/docker.sock"}
    findingCount: 1
  - name: "host-path-volumes: all paths allowlisted passes"
    rule: kubernetes-hardening.host-path-volumes
    outcome: pass
    parameters: {"host_path_allowed_paths": ["/var/log", "/var/run/docker.sock"]}
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              volumes:
                - {name: logs, hostPath: {path: /var/log}}
                - {name: sock, hostPath: {path: /var/run/docker.sock, type: Socket}}
                - {name: tmp, emptyDir: {}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "host-path-volumes: allowlist does not match path prefixes"
    rule: kubernetes-hardening.host-path-volumes
    outcome: fail
    parameters: {"host_path_allowed_paths": ["/var/log"]}
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              volumes: [{name: root, hostPath: {path: /var/log/../../}}]
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.host-path-volumes", "path": "deploy/app.yaml", "line": 1, "messageContains": "/var/log/../../"}
    findingCount: 1
  - name: "capabilities-drop-all: missing and partial drops fail"
    rule: kubernetes-hardening.capabilities-drop-all
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {capabilities: {drop: [NET_RAW]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
                - name: sidecar
                  image: registry.example.com/sidecar:1
                  securityContext: {}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.capabilities-drop-all", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app container \"app\" does not drop ALL capabilities"}
      - {"ruleId": "kubernetes-hardening.capabilities-drop-all", "path": "deploy/app.yaml", "line": 1, "messageContains": "container \"sidecar\" does not drop ALL"}
    findingCount: 2
  - name: "capabilities-drop-all: lowercase all is not ALL"
    rule: kubernetes-hardening.capabilities-drop-all
    outcome: fail
    files:
      deploy/app.yaml: |
