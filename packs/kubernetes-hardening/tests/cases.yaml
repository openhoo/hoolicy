                  securityContext: {allowPrivilegeEscalation: 'false'}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.privilege-escalation", "path": "deploy/app.yaml", "line": 1, "messageContains": "container \"app\""}
    findingCount: 1
  - name: "privilege-escalation: pod securityContext cannot satisfy container field"
    rule: kubernetes-hardening.privilege-escalation
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}, allowPrivilegeEscalation: false}
              hostname: app
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.privilege-escalation", "path": "deploy/app.yaml", "line": 1, "messageContains": "container \"app\""}
    findingCount: 1
  - name: "host-namespaces: each true namespace is reported"
    rule: kubernetes-hardening.host-namespaces
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              hostNetwork: true
              hostPID: true
              hostIPC: false
              containers:
                - name: app
                  image: registry.example.com/app:1
