  - name: "privileged: privileged initContainer and container both fail"
    rule: kubernetes-hardening.privileged
    outcome: fail
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: app, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              initContainers:
                - name: init
                  image: registry.example.com/init:1
                  securityContext: {privileged: true, allowPrivilegeEscalation: false}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {privileged: true}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.privileged", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app initContainer \"init\" sets securityContext.privileged: true", "key": "document:0:Deployment/app initContainer \"init\" sets securityContext.privileged: true"}
      - {"ruleId": "kubernetes-hardening.privileged", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app container \"app\" sets securityContext.privileged: true"}
    findingCount: 2
  - name: "privileged: explicit false passes"
    rule: kubernetes-hardening.privileged
    outcome: pass
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
