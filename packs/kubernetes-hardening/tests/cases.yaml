              hostIPC: false
              containers:
                - name: app
                  image: registry.example.com/app:1
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "host-namespaces: allowlisted node agent passes"
    rule: kubernetes-hardening.host-namespaces
    outcome: pass
    parameters: {"host_namespace_allowed_workloads": ["DaemonSet/node-exporter"]}
    files:
      deploy/agent.yaml: |
        apiVersion: apps/v1
