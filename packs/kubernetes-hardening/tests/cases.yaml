                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
    expect:
      - {"ruleId": "kubernetes-hardening.host-namespaces", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app sets hostNetwork: true"}
      - {"ruleId": "kubernetes-hardening.host-namespaces", "path": "deploy/app.yaml", "line": 1, "messageContains": "Deployment/app sets hostPID: true"}
    findingCount: 2
  - name: "host-namespaces: explicit false passes"
    rule: kubernetes-hardening.host-namespaces
    outcome: pass
    files:
      deploy/app.yaml: |
        apiVersion: apps/v1
        kind: Deployment
