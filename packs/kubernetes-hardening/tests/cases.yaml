                  securityContext: {privileged: false}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "privileged: ephemeralContainer is checked"
    rule: kubernetes-hardening.privileged
    outcome: fail
    files:
      k8s/pod.yaml: |
        apiVersion: v1
        kind: Pod
        metadata: {name: debug, namespace: shop}
        spec:
          containers: [{name: app}]
          ephemeralContainers: [{name: shell, securityContext: {privileged: true}}]
    expect:
      - {"ruleId": "kubernetes-hardening.privileged", "path": "k8s/pod.yaml", "line": 1, "messageContains": "Pod/debug ephemeralContainer \"shell\" sets securityContext.privileged: true"}
    findingCount: 1
  - name: "privileged: allowlisted workload passes"
    rule: kubernetes-hardening.privileged
    outcome: pass
    parameters: {"privileged_allowed_workloads": ["DaemonSet/node-agent"]}
    files:
      deploy/agent.yaml: |
        apiVersion: apps/v1
        kind: DaemonSet
        metadata: {name: node-agent, namespace: shop}
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              containers:
                - name: agent
                  image: registry.example.com/agent:1
                  securityContext: {privileged: true}
                  livenessProbe: {httpGet: {path: /healthz, port: 8080}}
                  readinessProbe: {httpGet: {path: /ready, port: 8080}}
  - name: "privileged: allowlist is exact Kind/name"
    rule: kubernetes-hardening.privileged
    outcome: fail
    parameters: {"privileged_allowed_workloads": ["DaemonSet/node-agent"]}
    files:
      deploy/agent.yaml: |
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: node-agent, namespace: shop}
        spec:
