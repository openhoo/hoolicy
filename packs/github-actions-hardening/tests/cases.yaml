version: 1
cases:
  # action-pinning
  - name: pinning composite action with sha local and digest refs passes
    rule: github-actions-hardening.action-pinning
    outcome: pass
    files:
      .github/actions/setup/action.yml: |
        name: setup
        runs:
          using: composite
          steps:
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
            - uses: ./.github/actions/cache
            - uses: docker://alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            - run: echo ok
              shell: bash
  - name: pinning tag in composite action fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    files:
      action.yaml: |
        name: root action
        runs:
          using: composite
          steps:
            - uses: actions/setup-node@v4
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: not pinned to a full commit SHA
        key: cel
    findingCount: 1
  - name: pinning short sha in nested action fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    files:
      tools/release/action.yml: |
        runs:
          using: composite
          steps:
            - uses: vendor/tool/sub@b7ad1da
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: not pinned
  - name: pinning uppercase sha fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - uses: vendor/tool@B7AD1DAD31E06C5925EF5D2FC7AD053EF454303E
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: not pinned
  - name: pinning docker image tag in docker action fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    files:
      action.yml: |
        name: docker action
        runs:
          using: docker
          image: docker://ghcr.io/vendor/tool:1.2.3
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: sha256 digest
  - name: pinning docker step without digest fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - uses: docker://alpine:3.20
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: not pinned
  - name: pinning local dockerfile and digest docker action pass
    rule: github-actions-hardening.action-pinning
    outcome: pass
    files:
      a/action.yml: |
        runs:
          using: docker
          image: Dockerfile
      b/action.yml: |
        runs:
          using: docker
          image: docker://ghcr.io/vendor/tool@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      c/action.yml: |
        runs:
          using: node20
          main: dist/index.js
  - name: pinning workflows are out of default scope
    rule: github-actions-hardening.action-pinning
    outcome: pass
    files:
      .github/workflows/ci.yml: |
        on: push
        permissions: {}
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
  - name: pinning selected workflows pass with sha matrix and local reusable calls
    rule: github-actions-hardening.action-pinning
    outcome: pass
    parameters:
      pinning_globs: ['.github/workflows/*.{yml,yaml}']
    files:
      .github/workflows/ci.yaml: |
        "on": [push, pull_request]
        permissions:
          contents: read
        jobs:
          test:
            strategy:
              matrix:
                os: [ubuntu-latest, macos-latest]
            runs-on: ${{ matrix.os }}
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          call-local:
            uses: ./.github/workflows/reusable.yml
          call-remote:
            uses: vendor/repo/.github/workflows/ci.yml@3d3c42e5aac5ba805825da76410c181273ba90b1
  - name: pinning selected workflow branch reusable call fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    parameters:
      pinning_globs: ['.github/workflows/*.{yml,yaml}']
    files:
      .github/workflows/ci.yml: |
        on: push
        jobs:
          ok:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          call:
            uses: vendor/repo/.github/workflows/ci.yml@main
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: reusable workflow
  - name: pinning selected workflow expression ref fails
    rule: github-actions-hardening.action-pinning
    outcome: fail
    parameters:
      pinning_globs: ['.github/workflows/*.{yml,yaml}']
    files:
      .github/workflows/ci.yml: |
        on: push
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: vendor/tool@${{ matrix.ref }}
    expect:
      - ruleId: github-actions-hardening.action-pinning
        messageContains: not pinned
  - name: pinning excluded vendored action passes
    rule: github-actions-hardening.action-pinning
    outcome: pass
    files:
      node_modules/pkg/action.yml: |
        runs:
          using: composite
          steps:
            - uses: vendor/tool@v1
  - name: pinning malformed action fails closed
    rule: github-actions-hardening.action-pinning
    outcome: error
    files:
      action.yml: |
        runs: [unterminated
    errorContains: action.yml
  # expression-injection
  - name: injection safe env handling passes
    rule: github-actions-hardening.expression-injection
    outcome: pass
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - run: echo "$TITLE" "${{ inputs.name }}" "${{ github.sha }}" "${{ github.event_name }}"
              shell: bash
              env:
                TITLE: ${{ github.event.pull_request.title }}
      .github/workflows/triage.yml: |
        on: issues
        permissions: {}
        jobs:
          label:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
                env:
                  BODY: ${{ github.event.issue.body }}
                with:
                  script: |
                    const body = process.env.BODY
                    core.info(`${{ github.repository }}`)
  - name: injection composite run interpolating event title fails
    rule: github-actions-hardening.expression-injection
    outcome: fail
    files:
      .github/actions/comment/action.yml: |
        runs:
          using: composite
          steps:
            - run: echo "${{ github.event.pull_request.title }}"
              shell: bash
    expect:
      - ruleId: github-actions-hardening.expression-injection
        messageContains: interpolates untrusted github.event or github.head_ref
        key: cel
    findingCount: 1
  - name: injection composite run head ref inside function fails
    rule: github-actions-hardening.expression-injection
    outcome: fail
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - shell: bash
              run: |
                set -eu
                git push origin "${{ format('{0}', github.head_ref) }}"
    expect:
      - ruleId: github-actions-hardening.expression-injection
        messageContains: untrusted
  - name: injection bracket event access fails
    rule: github-actions-hardening.expression-injection
    outcome: fail
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - shell: bash
              run: echo "${{ github['event'].comment.body }}"
    expect:
      - ruleId: github-actions-hardening.expression-injection
        messageContains: untrusted
  - name: injection workflow github-script interpolation fails
    rule: github-actions-hardening.expression-injection
    outcome: fail
    files:
      .github/workflows/comment.yaml: |
        on: issue_comment
        permissions:
          issues: write
        jobs:
          reply:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
                with:
                  script: |
                    const text = "${{ github.event.comment.body }}"
    expect:
      - ruleId: github-actions-hardening.expression-injection
        messageContains: github-script
  - name: injection workflow run scripts are left to ci-workflow-security
    rule: github-actions-hardening.expression-injection
    outcome: pass
    files:
      .github/workflows/ci.yml: |
        on: pull_request
        permissions: {}
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - run: echo "${{ github.event.pull_request.title }}"
  - name: injection similarly named contexts pass
    rule: github-actions-hardening.expression-injection
    outcome: pass
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - shell: bash
              run: echo "${{ inputs.github.event }}" "${{ mygithub.event }}" "${{ github.events }}" "github.event.issue.title"
  # privileged-checkout
  - name: privileged checkout of base ref passes
    rule: github-actions-hardening.privileged-checkout
    outcome: pass
    files:
      .github/workflows/label.yml: |
        on: pull_request_target
        permissions:
          pull-requests: write
        jobs:
          label:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.event.pull_request.base.sha }}
  - name: unprivileged pull request checkout of head passes
    rule: github-actions-hardening.privileged-checkout
    outcome: pass
    files:
      .github/workflows/ci.yml: |
        on: pull_request
        permissions: {}
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.event.pull_request.head.sha }}
  - name: workflow run checkout of head sha fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/report.yml: |
        on:
          workflow_run:
            workflows: [CI]
            types: [completed]
        permissions:
          checks: write
        jobs:
          report:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.event.workflow_run.head_sha }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: checks out untrusted pull-request code
        key: cel
    findingCount: 1
  - name: pull request target list trigger with head ref in second job fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/multi.yml: |
        on: [push, pull_request_target]
        permissions: {}
        jobs:
          safe:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          unsafe:
            runs-on: ubuntu-latest
            steps:
              - run: echo first
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.head_ref }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: pull_request_target or workflow_run
  - name: pull request target refs pull merge ref fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/pr.yml: |
        on:
          pull_request_target:
            types: [opened]
        permissions: {}
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  ref: refs/pull/${{ github.event.number }}/merge
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: untrusted
  - name: pull request target fork repository input fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/pr.yml: |
        on:
          pull_request_target: {}
        permissions: {}
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: untrusted
  - name: boolean true trigger key from YAML 1.1 tooling is still recognized
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/legacy.yml: |
        true:
          pull_request_target:
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  ref: ${{ github.event.pull_request.head.ref }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: untrusted
  - name: quoted on key with pull request target fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/quoted.yml: |
        "on": pull_request_target
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: untrusted
  - name: workflow run head checkout guarded by push event job condition passes
    rule: github-actions-hardening.privileged-checkout
    outcome: pass
    files:
      .github/workflows/release.yml: |
        on:
          workflow_run:
            workflows: [CI]
            branches: [main]
            types: [completed]
          workflow_dispatch:
        permissions:
          contents: read
        jobs:
          release:
            if: >-
              (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
              github.event_name == 'workflow_dispatch'
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
          trusted-pr:
            if: github.event.pull_request.head.repo.full_name == github.repository
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.event.pull_request.head.sha }}
  - name: workflow run head checkout with only a branch filter fails
    rule: github-actions-hardening.privileged-checkout
    outcome: fail
    files:
      .github/workflows/release.yml: |
        on:
          workflow_run:
            workflows: [CI]
            branches: [main]
            types: [completed]
        permissions:
          contents: read
        jobs:
          release:
            if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  ref: ${{ github.event.workflow_run.head_branch }}
    expect:
      - ruleId: github-actions-hardening.privileged-checkout
        messageContains: untrusted
  # checkout-persist-credentials
  - name: persist credentials false in workflow and composite passes
    rule: github-actions-hardening.checkout-persist-credentials
    outcome: pass
    files:
      .github/workflows/ci.yml: |
        on: push
        permissions: {}
        jobs:
          a:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  persist-credentials: false
          b:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  fetch-depth: 0
                  persist-credentials: "false"
              - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      action.yml: |
        runs:
          using: composite
          steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                persist-credentials: false
  - name: checkout without with block fails
    rule: github-actions-hardening.checkout-persist-credentials
    outcome: fail
    files:
      .github/workflows/ci.yml: |
        on: push
        permissions: {}
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    expect:
      - ruleId: github-actions-hardening.checkout-persist-credentials
        messageContains: does not set persist-credentials to false
        key: cel
    findingCount: 1
  - name: checkout persist credentials true in matrix job fails
    rule: github-actions-hardening.checkout-persist-credentials
    outcome: fail
    files:
      .github/workflows/ci.yml: |
        on: push
        permissions: {}
        jobs:
          test:
            strategy:
              matrix:
                os: [ubuntu-latest, windows-latest]
            runs-on: ${{ matrix.os }}
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                  persist-credentials: true
    expect:
      - ruleId: github-actions-hardening.checkout-persist-credentials
        messageContains: persist-credentials
  - name: checkout persist credentials expression fails
    rule: github-actions-hardening.checkout-persist-credentials
    outcome: fail
    files:
      action.yml: |
        runs:
          using: composite
          steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                persist-credentials: ${{ inputs.persist }}
    expect:
      - ruleId: github-actions-hardening.checkout-persist-credentials
        messageContains: persist-credentials
  - name: checkout warning severity is advisory
    rule: github-actions-hardening.checkout-persist-credentials
    outcome: fail
    files:
      .github/workflows/release.yaml: |
        on: push
        jobs:
          release:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  fetch-depth: 0
    expect:
      - ruleId: github-actions-hardening.checkout-persist-credentials
        messageContains: actions/checkout
        waived: false
        hasFix: false
  # top-level-permissions
  - name: top level permissions declared passes
    rule: github-actions-hardening.top-level-permissions
    outcome: pass
    files:
      .github/workflows/ci.yml: |
        on: push
        permissions:
          contents: read
        jobs:
          a:
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
      .github/workflows/empty.yaml: |
        "on": push
        permissions: {}
        jobs:
          a:
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
      .github/workflows/readall.yml: |
        on: push
        permissions: read-all
        jobs:
          a:
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
  - name: no workflows passes
    rule: github-actions-hardening.top-level-permissions
    outcome: pass
    files:
      README.md: no workflows
  - name: job only permissions fail top level requirement
    rule: github-actions-hardening.top-level-permissions
    outcome: fail
    files:
      .github/workflows/release.yml: |
        on: push
        jobs:
          release:
            permissions:
              contents: write
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
    expect:
      - ruleId: github-actions-hardening.top-level-permissions
        path: .github/workflows/release.yml
        messageContains: 'Workflow token permissions are implicit: Field "/permissions" is required'
        key: document:0:/permissions:is required
    findingCount: 1
  - name: each workflow without permissions is reported by path
    rule: github-actions-hardening.top-level-permissions
    outcome: fail
    files:
      .github/workflows/a.yml: |
        on: push
        permissions:
          contents: read
        jobs: {}
      .github/workflows/b.yaml: |
        on: push
        jobs: {}
      .github/workflows/c.yml: |
        on: pull_request
        jobs: {}
    expect:
      - ruleId: github-actions-hardening.top-level-permissions
        path: .github/workflows/b.yaml
        messageContains: implicit
      - ruleId: github-actions-hardening.top-level-permissions
        path: .github/workflows/c.yml
        messageContains: implicit
    findingCount: 2
  - name: nested workflow directory is not selected
    rule: github-actions-hardening.top-level-permissions
    outcome: pass
    files:
      .github/workflows/templates/partial.yml: |
        jobs: {}
  # reusable-secrets-inherit
  - name: local secrets inherit and explicit remote secrets pass
    rule: github-actions-hardening.reusable-secrets-inherit
    outcome: pass
    files:
      .github/workflows/caller.yml: |
        on: push
        permissions: {}
        jobs:
          local:
            uses: ./.github/workflows/deploy.yml
            secrets: inherit
          remote:
            uses: vendor/shared/.github/workflows/deploy.yml@3d3c42e5aac5ba805825da76410c181273ba90b1
            secrets:
              token: ${{ secrets.DEPLOY_TOKEN }}
          plain:
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
  - name: remote reusable workflow with secrets inherit fails
    rule: github-actions-hardening.reusable-secrets-inherit
    outcome: fail
    files:
      .github/workflows/caller.yml: |
        on: push
        permissions: {}
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
          deploy:
            needs: build
            uses: vendor/shared/.github/workflows/deploy.yml@3d3c42e5aac5ba805825da76410c181273ba90b1
            secrets: inherit
    expect:
      - ruleId: github-actions-hardening.reusable-secrets-inherit
        messageContains: secrets inherit to a reusable workflow outside this repository
        key: cel
    findingCount: 1
  - name: same organization remote reusable workflow still fails
    rule: github-actions-hardening.reusable-secrets-inherit
    outcome: fail
    files:
      .github/workflows/caller.yaml: |
        "on": workflow_dispatch
        jobs:
          call:
            uses: my-org/my-repo/.github/workflows/release.yml@main
            secrets: inherit
    expect:
      - ruleId: github-actions-hardening.reusable-secrets-inherit
        messageContains: outside this repository
