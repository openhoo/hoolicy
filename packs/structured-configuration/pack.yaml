version: 1
name: structured-configuration
release: 0.1.0
description: Explicit typed configuration invariants for production service configuration.
maturity: experimental
owner: openhoo/hoolicy-maintainers
compatibilityNotes: Opt-in example contract for service-owned configuration; adapt field pointers to the actual application before enforcement.
compatibility:
  config: '>=1 <2'
  hoolicy: '>=0.5.0-0 <0.5.0 || >=0.5.0 <2.0.0'
parameters:
  configuration_files:
    type: string_list
    default: [config/production.json, config/production.yaml, config/production.yml, config/production.toml]
    description: Service configuration files using this pack's explicit production contract.
  minimum_replicas:
    type: number
    default: 2
    description: Minimum production replica count approved by service owners.
  maximum_timeout_ms:
    type: number
    default: 30000
    description: Maximum positive request timeout in milliseconds.
rules:
  - id: structured-configuration.production-mode
    title: Production configuration disables debugging
    description: Requires production environment and a false debug flag in each selected document.
    rationale: Debug behavior can expose internals and use development defaults in production.
    remediation: Set environment to production and debug to false in the reviewed deployment configuration.
    severity: error
    kind: structured.fields
    files: ['{{ configuration_files }}']
    spec:
      fields:
        - pointer: /environment
          required: true
          type: string
          allowedValues: [production]
        - pointer: /debug
          required: true
          type: boolean
          allowedValues: [false]
      message: Production mode configuration is unsafe
  - id: structured-configuration.availability
    title: Production configuration bounds replicas and timeouts
    description: Checks numeric fields for minimum replicas and positive bounded request timeouts.
    rationale: Unbounded timeouts and insufficient redundancy undermine service availability.
    remediation: Configure an integer replica count at or above the approved minimum and a positive bounded timeoutMs.
    severity: error
    kind: structured.fields
    files: ['{{ configuration_files }}']
    spec:
      fields:
        - pointer: /replicas
          required: true
          type: integer
          minimum: '{{ minimum_replicas }}'
        - pointer: /timeoutMs
          required: true
          type: integer
          minimum: 1
          maximum: '{{ maximum_timeout_ms }}'
      message: Production availability configuration is outside approved bounds
  - id: structured-configuration.browser-origins
    title: Production browser origins are explicit and unique
    description: Requires a nonempty array of unique origins and forbids disabling TLS verification.
    rationale: Explicit browser origins and certificate verification reduce unintended trust expansion.
    remediation: List reviewed allowedOrigins once each, remove wildcard entries, and remove insecureSkipVerify.
    severity: error
    kind: structured.fields
    files: ['{{ configuration_files }}']
    spec:
      fields:
        - pointer: /allowedOrigins
          required: true
          type: array
          minItems: 1
          uniqueItems: true
        - pointer: /insecureSkipVerify
          forbidden: true
      message: Production browser trust configuration is unsafe
  - id: structured-configuration.no-wildcard-origins
    title: Browser origin entries are strings without wildcard trust
    description: Checks each allowedOrigins entry for a nonempty string without wildcard characters.
    rationale: Wildcard browser trust can unintentionally authorize unreviewed sites.
    remediation: Replace wildcard entries with individually reviewed nonempty origin strings.
    severity: error
    kind: structured.cel
    files: ['{{ configuration_files }}']
    spec:
      expression: "documents.size() > 0 && documents.all(d, 'allowedOrigins' in d.data && type(d.data.allowedOrigins) == list && d.data.allowedOrigins.all(o, type(o) == string && o.size() > 0 && !o.contains('*')))"
      message: Browser origins must be explicit strings without wildcards
