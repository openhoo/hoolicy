  - name: configured dialect tags pass
    rule: acceptance-coverage.accessibility-scenarios
    outcome: pass
    files:
      features/product.feature: |
        # language: de
        Funktionalität: Bedienbarkeit
          @barrierefreiheit
          Szenario: Tastaturbedienung
            Angenommen die Ansicht ist geöffnet
            Dann ist das Formular per Tastatur bedienbar
    parameters:
      gherkin_language: de
      accessibility_tags:
        - '@barrierefreiheit'
  - name: malformed acceptance feature fails closed
    rule: acceptance-coverage.failure-scenarios
    outcome: error
    files:
      features/product.feature: |
        Feature: Broken
          Scenario: Unterminated doc string
            Given invalid input
              """
              never closed
    errorContains: features/product.feature
