version: 1
cases:
  - name: failure and recovery scenario passes
    rule: acceptance-coverage.failure-scenarios
    outcome: pass
    files:
      features/product.feature: |
        Feature: Product behavior
          @failure
          Scenario: Required behavior
            Given a relevant condition
            When the user acts
            Then the expected outcome is observable
  - name: failure and recovery tag missing fails
    rule: acceptance-coverage.failure-scenarios
    outcome: fail
    files:
      features/product.feature: |
        Feature: Product behavior
          Scenario: Ordinary behavior
            Given a valid input
            Then the normal outcome occurs
    expect:
      - ruleId: acceptance-coverage.failure-scenarios
        messageContains: required scenario tag @failure is missing
        waived: false
        hasFix: false
        key: tag:@failure
        path: features/product.feature
  - name: failure and recovery word in prose cannot satisfy tag
    rule: acceptance-coverage.failure-scenarios
    outcome: fail
    files:
      features/product.feature: |
        Feature: @failure is mentioned in prose
          Scenario: Normal behavior
            Given the @failure string is displayed
            Then behavior is normal
    expect:
      - ruleId: acceptance-coverage.failure-scenarios
        messageContains: required scenario tag @failure is missing
        waived: false
        hasFix: false
        key: tag:@failure
        path: features/product.feature
  - name: accessibility scenario passes
