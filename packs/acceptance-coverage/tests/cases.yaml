        Feature: @accessibility is mentioned in prose
          Scenario: Normal behavior
            Given the @accessibility string is displayed
            Then behavior is normal
    expect:
      - ruleId: acceptance-coverage.accessibility-scenarios
        messageContains: required scenario tag @accessibility is missing
        waived: false
        hasFix: false
        key: tag:@accessibility
        path: features/product.feature
